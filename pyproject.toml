[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-mod-ai"
version = "0.1.0"
description = "R.M.M: Roblox Mod & Experience AI - Automated planning, Luau generation, Creator Store discovery, and .rbxlx production"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "R.M.M Contributors" }]
dependencies = [
    "httpx>=0.27.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rmm = "roblox_mod_ai.cli:main"
roblox-mod-ai = "roblox_mod_ai.cli:main"
rmm-mcp = "roblox_mod_ai.mcp_server:main"

[tool.setuptools.packages.find]
include = ["roblox_mod_ai*"]
