name: RMM plan93 source-owner regression

on:
  pull_request:
    branches: [main]
    paths:
      - "roblox_mod_ai/source_owned_microplanning.py"
      - "roblox_mod_ai/atomic_action_quotes.py"
      - "tests/test_plan93_atomic_source_ownership.py"
      - ".github/workflows/rmm-plan93-source-owner-regression.yml"
  workflow_dispatch:

jobs:
  source-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" pytest
      - run: python -m pytest -q tests/test_plan93_atomic_source_ownership.py tests/test_plan70_source_complete_microplanning.py tests/test_plan69_atomic_repair_recovery.py tests/test_plan92_reviewer_and_world_harvest.py
