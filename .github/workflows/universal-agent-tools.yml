name: Universal Roblox tool-agent contract

on:
  pull_request:
    branches: [main]
    paths:
      - "roblox_mod_ai/agent_tool_runtime.py"
      - "roblox_mod_ai/model_router.py"
      - "roblox_mod_ai/model_adapters/llama_cpp_adapter.py"
      - "roblox_mod_ai/host_service_codegen.py"
      - "roblox_mod_ai/agent_loop.py"
      - "roblox_mod_ai/orchestrator.py"
      - "tests/test_universal_agent_tools.py"
      - "tests/test_log30_hud_single_writer.py"
      - "tests/test_log31_selene_codegen.py"
      - "tests/test_log32_model_authority.py"
      - "tests/test_log33_authority_replanning.py"
      - "tests/test_log34_authority_production_parity.py"
      - "tests/test_log34_atomic_authority_feedback.py"
      - "tests/test_log35_transaction_atom.py"
      - "roblox_mod_ai/source_owned_microplanning.py"
      - "roblox_mod_ai/atomic_transaction_repair.py"
      - "roblox_mod_ai/dynamic_architect.py"
      - "roblox_mod_ai/compact_atomic_authoring.py"
      - "roblox_mod_ai/atomic_action_authoring.py"
      - "roblox_mod_ai/architecture_failure_receipt.py"
      - "roblox_mod_ai/authority_architecture_repair.py"
      - "roblox_mod_ai/planner.py"
      - "roblox_mod_ai/dynamic_architect.py"
      - "roblox_mod_ai/model_action_authority.py"
      - "roblox_mod_ai/host_verified_typed_effects.py"
      - "roblox_mod_ai/host_hud.py"
      - "roblox_mod_ai/project_generator.py"
      - "roblox_mod_ai/studio_bridge.py"
      - "roblox_mod_ai/roblox_value_contract.py"
      - ".github/workflows/universal-agent-tools.yml"
  workflow_dispatch:

jobs:
  agent-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Tool permissions, native tool messages and source receipts
        run: python -m pytest -q tests/test_universal_agent_tools.py tests/test_log25_verified_typed_effects.py tests/test_log26_real_proposal_regression.py tests/test_log27_orbit_world_abi.py tests/test_log30_hud_single_writer.py tests/test_46_host_ui_dock.py tests/test_57_host_hud.py tests/test_plan78_roblox_runtime_value_contracts.py tests/test_official_docs_studio.py tests/test_log31_selene_codegen.py tests/test_log32_model_authority.py tests/test_log33_authority_replanning.py tests/test_log34_authority_production_parity.py tests/test_log34_atomic_authority_feedback.py tests/test_log35_transaction_atom.py
