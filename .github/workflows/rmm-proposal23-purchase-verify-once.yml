name: RMM proposal23 purchase contract regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rmm-proposal23-purchase-verify-once.yml']
permissions:
  contents: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]' pytest nbformat httpx pytest-cov
      - name: Compile sources and run complete test suite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m compileall -q roblox_mod_ai tests >/tmp/proposal23.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python -m pytest -q tests >> /tmp/proposal23.log 2>&1
            rc=$?
          fi
          {
            echo "tested_commit=$GITHUB_SHA"
            echo "exit_code=$rc"
            tail -c 27000 /tmp/proposal23.log
          } > /tmp/proposal23-result.txt
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/rmm-proposal23-full-ci-v2.txt" \
            -f message='test(rmm): full regression purchase contract result' \
            -f content="$(base64 -w0 /tmp/proposal23-result.txt)" -f branch=main
          exit "$rc"
