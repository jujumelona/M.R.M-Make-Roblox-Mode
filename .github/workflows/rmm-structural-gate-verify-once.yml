name: RMM structural codegen contract full CI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rmm-structural-gate-verify-once.yml']
permissions:
  contents: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]' pytest nbformat httpx pytest-cov
      - name: Compile and complete unit regression
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m compileall -q roblox_mod_ai tests >/tmp/rmm-structural.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python -m pytest -q tests >>/tmp/rmm-structural.log 2>&1
            rc=$?
          fi
          {
            echo "tested_commit=$GITHUB_SHA"
            echo "exit_code=$rc"
            tail -c 26000 /tmp/rmm-structural.log
          } >/tmp/rmm-structural-result.txt
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/rmm-structural-ci.txt" \
            -f message='test(rmm): record complete codegen structural CI' \
            -f content="$(base64 -w0 /tmp/rmm-structural-result.txt)" -f branch=main
          exit "$rc"
