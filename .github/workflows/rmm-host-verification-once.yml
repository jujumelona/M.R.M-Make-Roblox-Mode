name: RMM host gameplay one-time verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rmm-host-verification-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  host-tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install -e ".[dev]" pytest
      - name: Run source and contract regressions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m compileall -q roblox_mod_ai tests > /tmp/rmm-tests.log 2>&1
          compile_rc=$?
          if [[ "$compile_rc" == "0" ]]; then
            python -m pytest -q tests/test_host_mining.py tests/test_host_trading.py tests/test_host_service_codegen.py >> /tmp/rmm-tests.log 2>&1
            test_rc=$?
          else
            test_rc=$compile_rc
          fi
          {
            echo "tested_commit=$GITHUB_SHA"
            echo "exit_code=$test_rc"
            head -c 18000 /tmp/rmm-tests.log
          } > /tmp/rmm-host-result.txt
          encoded=$(base64 -w0 /tmp/rmm-host-result.txt)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/rmm-host-verification-result.txt" \
            -f message="test(rmm): record actual host gameplay test result" \
            -f content="$encoded" -f branch=main
          exit "$test_rc"
