name: RMM root cause audit verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rmm-root-cause-audit-once.yml']
permissions:
  contents: write
jobs:
  all-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -e '.[dev]' pytest nbformat httpx pytest-cov
      - name: Full repository regression
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m compileall -q roblox_mod_ai tests >/tmp/audit.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python -m pytest -q tests >> /tmp/audit.log 2>&1
            rc=$?
          fi
          {
            echo "tested_commit=$GITHUB_SHA"
            echo "exit_code=$rc"
            tail -c 28000 /tmp/audit.log
          } >/tmp/audit-result.txt
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/rmm-root-audit-ci.txt" \
            -f message='test(rmm): capture root cause audit full suite' \
            -f content="$(base64 -w0 /tmp/audit-result.txt)" -f branch=main
          exit "$rc"
