name: RMM 26 source-contract regression

on:
  pull_request:
    branches: [ main ]
    paths:
      - "roblox_mod_ai/host_verified_typed_effects.py"
      - "roblox_mod_ai/world_object_abi.py"
      - "roblox_mod_ai/typed_action_contract.py"
      - "roblox_mod_ai/code_generator.py"
      - "roblox_mod_ai/generation_scope.py"
      - "tests/test_log25_verified_typed_effects.py"
      - "tests/test_log26_real_proposal_regression.py"
      - "tests/test_log27_orbit_world_abi.py"
      - ".github/workflows/rmm-log26-regression.yml"
  workflow_dispatch:

jobs:
  targeted-source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" pytest
      - name: Replay log 25 and log 26 with static Luau analysis
        run: python -m pytest -q tests/test_log25_verified_typed_effects.py tests/test_log26_real_proposal_regression.py tests/test_log27_orbit_world_abi.py tests/test_plan79_world_contract.py tests/test_56_colony_checkpoint_gate.py
