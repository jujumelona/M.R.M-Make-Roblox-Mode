name: RMM source micro-planning regression
on:
  push:
    branches: [main]
    paths:
      - 'roblox_mod_ai/atomic_action_quotes.py'
      - 'roblox_mod_ai/atomic_action_authoring.py'
      - 'roblox_mod_ai/source_owned_microplanning.py'
      - 'roblox_mod_ai/semantic_preservation.py'
      - 'roblox_mod_ai/dynamic_architect.py'
      - 'roblox_mod_ai/planner.py'
      - 'roblox_mod_ai/orchestrator.py'
      - 'roblox_mod_ai/api.py'
      - 'roblox_mod_ai/mcp_server.py'
      - 'tests/test_plan69_atomic_repair_recovery.py'
      - 'tests/test_plan70_source_complete_microplanning.py'
      - 'tests/test_plan71_trade_repair.py'
      - 'roblox_mod_ai/atomic_transaction_repair.py'
      - 'roblox_mod_ai/scoped_luau_abi.py'
      - 'roblox_mod_ai/request_semantics.py'
      - 'roblox_mod_ai/world_object_abi.py'
      - 'roblox_mod_ai/gameplay_effect_safety.py'
      - 'roblox_mod_ai/host_service_codegen.py'
      - 'roblox_mod_ai/module_generation_gate.py'
      - 'roblox_mod_ai/server_interface_audit.py'
      - 'roblox_mod_ai/gameplay_effect_safety.py'
      - 'roblox_mod_ai/roblox_value_contract.py'
      - 'roblox_mod_ai/typed_action_contract.py'
      - 'roblox_mod_ai/host_mining_contract.py'
      - 'roblox_mod_ai/host_mining.py'
      - 'tests/test_plan72_atomic_transaction.py'
      - 'tests/test_plan73_payment_contract_regression.py'
      - 'tests/test_phase_separation_plan_vs_implementation.py'
      - 'tests/test_plan75_scoped_host_abi.py'
      - 'tests/test_plan75_host_resource_codegen.py'
      - 'tests/test_plan76_typed_contract_alignment.py'
      - 'tests/test_plan77_gameplay_codegen_integrity.py'
      - 'tests/test_plan78_roblox_runtime_value_contracts.py'
      - 'tests/test_plan79_source_to_peer_abi.py'
      - 'tests/test_plan79_world_contract.py'
      - '.github/workflows/rmm-source-micro-regression.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run source-owned micro-planning regressions
        run: |
          python -m pytest -q tests/test_plan69_atomic_repair_recovery.py
          python -m pytest -q tests/test_plan70_source_complete_microplanning.py
          python -m pytest -q tests/test_plan71_trade_repair.py
          python -m pytest -q tests/test_plan72_atomic_transaction.py
          python -m pytest -q tests/test_plan73_payment_contract_regression.py
          python -m pytest -q tests/test_phase_separation_plan_vs_implementation.py
          python -m pytest -q tests/test_plan75_scoped_host_abi.py
          python -m pytest -q tests/test_plan75_host_resource_codegen.py
          python -m pytest -q tests/test_plan76_typed_contract_alignment.py
          python -m pytest -q tests/test_plan77_gameplay_codegen_integrity.py
          python -m pytest -q tests/test_plan78_roblox_runtime_value_contracts.py
          python -m pytest -q tests/test_plan79_source_to_peer_abi.py
          python -m pytest -q tests/test_plan79_world_contract.py
          python -m pytest -q tests/test_plan67_compact_atomic.py tests/test_plan67_four_action_scope.py
