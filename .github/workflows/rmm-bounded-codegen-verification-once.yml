name: RMM bounded codegen full regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rmm-bounded-codegen-verification-once.yml']
permissions:
  contents: write
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]' pytest nbformat httpx pytest-cov
      - name: Compile and run full tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m compileall -q roblox_mod_ai tests > /tmp/bounded-tests.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python -m pytest -q tests >> /tmp/bounded-tests.log 2>&1
            rc=$?
          fi
          {
            echo "tested_commit=$GITHUB_SHA"
            echo "exit_code=$rc"
            tail -c 29000 /tmp/bounded-tests.log
          } > /tmp/bounded-tests-result.txt
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/rmm-bounded-codegen-ci-v6.txt" \
            -f message='test(rmm): actual bounded model regression results' \
            -f content="$(base64 -w0 /tmp/bounded-tests-result.txt)" -f branch=main
          exit "$rc"
