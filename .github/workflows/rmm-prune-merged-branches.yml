name: RMM one-time merged branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rmm-prune-merged-branches.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prune:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify ancestry and remove only already-merged named refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in 'codex/repair-generation-20261019' 'fix/proposal13-scoped-detailed-plan' 'fix/proposal14-host-source-fallback'; do
            encoded=$(BRANCH="$branch" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["BRANCH"], safe=""))')
            ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${encoded}" --jq '.ahead_by')
            if [[ "$ahead" != "0" ]]; then
              echo "Refusing to delete $branch: it has $ahead commits missing from main" >&2
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --silent; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "DELETED $branch (no unmerged commits)"
            else
              echo "ALREADY ABSENT $branch"
            fi
          done
      - name: Delete this one-time workflow after successful cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/rmm-prune-merged-branches.yml'
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" --jq '.sha')
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message='chore(rmm): remove temporary merged branch cleanup workflow' -f sha="$sha" -f branch=main
