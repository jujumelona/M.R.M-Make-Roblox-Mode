name: RMM currency full verification (one time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rmm-currency-verification-once.yml']
permissions:
  contents: write
jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]' pytest nbformat httpx pytest-cov
      - name: Real full regression suite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m compileall -q roblox_mod_ai tests > /tmp/rmm-currency-ci.log 2>&1
          compile_status=$?
          if [ "$compile_status" -eq 0 ]; then
            python -m pytest -q tests >> /tmp/rmm-currency-ci.log 2>&1
            status=$?
          else
            status=$compile_status
          fi
          {
            echo "tested_commit=$GITHUB_SHA"
            echo "exit_code=$status"
            tail -c 16000 /tmp/rmm-currency-ci.log
          } > /tmp/rmm-currency-peers-ci-result.txt
          payload=$(base64 -w0 /tmp/rmm-currency-peers-ci-result.txt)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/rmm-currency-peers-ci-result.txt" \
            -f message='test(rmm): capture currency and full regression suite output' \
            -f content="$payload" -f branch=main
          exit "$status"
