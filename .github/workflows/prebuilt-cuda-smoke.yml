name: Pinned llama.cpp CUDA binary smoke

on:
  push:
    branches: [main]
    paths:
      - "roblox_mod_ai/colab_model_runtime.py"
      - "tests/test_colab_model_runtime.py"
      - ".github/workflows/prebuilt-cuda-smoke.yml"
  workflow_dispatch:

jobs:
  verify-prebuilt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MRM Python dependencies
        run: python -m pip install -e .
      - name: Install CUDA 12.8 runtime-only wheel (no GPU required for ELF inspection)
        run: python -m pip install --no-deps nvidia-cuda-runtime-cu12==12.8.90
      - name: Verify pinned release asset and extract real runtime
        run: |
          python - <<'PY'
          import os
          import platform
          import stat
          import subprocess
          import tempfile
          from pathlib import Path

          from roblox_mod_ai.colab_model_runtime import (
              CUDA_RELEASE_SHA256,
              CUDA_RELEASE_URL,
              _download_pinned_cuda_bundle,
              _extract_prebuilt_cuda_bundle,
          )

          print("Pinned release:", CUDA_RELEASE_URL, flush=True)
          print("SHA-256:", CUDA_RELEASE_SHA256, flush=True)
          with tempfile.TemporaryDirectory(prefix="rmm-cuda-ci-") as d:
              root = Path(d)
              archive = root / "cuda.tar.gz"
              _download_pinned_cuda_bundle(CUDA_RELEASE_URL, CUDA_RELEASE_SHA256, archive)
              binary = _extract_prebuilt_cuda_bundle(archive, root / "runtime")
              assert binary.is_file() and binary.stat().st_size > 0
              print("Actual llama-server executable bytes:", binary.stat().st_size, flush=True)
              assert binary.stat().st_mode & stat.S_IXUSR
              libs = list(binary.parent.glob("lib*.so*"))
              assert libs, "Archive has no shared libraries"
              print("Actual extracted CUDA binary:", binary, flush=True)
              print("Shared libraries:", [x.name for x in libs], flush=True)
              result = subprocess.run(["file", str(binary)], capture_output=True, text=True, check=True)
              print(result.stdout.strip(), flush=True)
              assert "ELF 64-bit" in result.stdout
              # CUDA 12 runtime is shipped in the Python NVIDIA wheel, not
              # necessarily in /usr/local/cuda/lib64. Verify our linker resolver.
              from roblox_mod_ai.colab_model_runtime import (
                  _cuda_env, _ldd_missing_libraries,
              )
              env = _cuda_env(binary)
              print("CUDA runtime search path:", env.get("LD_LIBRARY_PATH", ""), flush=True)
              assert any((Path(p) / "libcudart.so.12").is_file()
                         for p in env["LD_LIBRARY_PATH"].split(os.pathsep))
              missing = _ldd_missing_libraries(binary, env)
              print("Other unresolved ELF dependencies on CPU CI runner:",
                    sorted(missing), flush=True)
              assert "libcudart.so.12" not in missing, (
                  "CUDA runtime wheel was installed but llama-server still "
                  "cannot resolve libcudart.so.12"
              )
              # A GPU runner is unavailable here. Do not misrepresent this as a
              # Colab/T4 inference test. The actual archive is verified, however.
          PY
