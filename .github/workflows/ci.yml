name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      RMM_PREDESIGN_LIVE_SEARCH: "0"  # CI uses explicit deterministic mocks for network RAG
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install nbformat pytest httpx pytest-cov

      - name: Compile every Python source and validate dependencies
        run: |
          python -m compileall -q roblox_mod_ai tools tests
          python -m pip check

      - name: Validate Google Colab Notebook
        run: |
          python tools/validate_colab_notebook.py

      - name: Run Test Suite (pytest)
        run: |
          python -m pytest tests -v --cov=roblox_mod_ai --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload exact coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
