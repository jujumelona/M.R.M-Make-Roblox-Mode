name: RMM source permission before producer preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "roblox_mod_ai/dynamic_architect.py"
      - "roblox_mod_ai/authority_architecture_repair.py"
      - "roblox_mod_ai/host_resource_market_sale.py"
      - "tests/test_plan94_early_authority_binding.py"
      - ".github/workflows/rmm-authority-before-preflight.yml"
  workflow_dispatch:

jobs:
  source-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" pytest
      - run: python -m pytest -q tests/test_plan94_early_authority_binding.py tests/test_plan86_market_sale_and_ship_catalog.py tests/test_log33_authority_replanning.py tests/test_log34_authority_production_parity.py tests/test_plan94_grounded_atomic_and_construction.py
