name: Rojo real build smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile-generated-game:
    runs-on: ubuntu-latest
    env:
      RMM_PREDESIGN_LIVE_SEARCH: "0"  # CI uses explicit deterministic mocks for network RAG
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python project
        run: pip install -e ".[dev]"
      - name: Fast negative-source and seven-facet regression gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_ci_remote_fault_matrix.py \
            tests/test_ci_code_snapshot_and_realms.py \
            tests/test_ci_luau_api_failure_corpus.py \
            tests/test_ci_real_e2e_receipts.py \
            tests/test_e2e_server_interface_contract.py \
            tests/test_space_seven_facets_e2e.py \
            tests/test_generalized_host_prompt_matrix.py \
            tests/test_host_client_transport.py \
            tests/test_host_world_prompt.py \
            tests/test_purchase_request_semantics.py \
            tests/test_uploaded_service_recovery.py \
            tests/test_codegen_scope_handoff.py \
            tests/test_generated_dependency_api.py \
            tests/test_source_repair_cycle.py \
            tests/test_detailed_plan_and_source_review.py
      - name: Install real Roblox toolchain
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      - name: Reproduce failed EconomyLedger with actual StyLua 2.x parser
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, shutil
          from roblox_mod_ai.luau_analyzer import LuauStaticAnalyzer
          assert shutil.which("stylua"), "Real StyLua parser missing from CI"
          os.environ["RMM_REQUIRE_REAL_LUAU_PARSER"] = "1"
          analyzer = LuauStaticAnalyzer()
          invalid = ("--!strict\nlocal Ledger = {}\n"
                     "function validateCredit(player): void? do\n"
                     "  local balance :: number? invalid code\n"
                     "end\n")
          failures = [x for x in analyzer.analyze_source(
              invalid, "src/server/EconomyLedger.server.luau")
              if x.severity == "ERROR"]
          assert failures and failures[0].rule == "LUAU_PARSER_SYNTAX", failures
          print("Actual StyLua parse failure:", failures[0].message[:600])
          valid = ("--!strict\nlocal function deposit(balance: number, "
                   "delta: number): number\n"
                   "    return math.max(0, balance + delta)\n"
                   "end\nprint(deposit)\n")
          assert not [x for x in analyzer.analyze_source(valid)
                      if x.severity == "ERROR"], "Real parser rejected valid Luau"
          PY
      - name: Reproduce uploaded responses and execute actual generated player persistence
        env:
          RMM_REQUIRE_REAL_LUAU_PARSER: "1"
        run: python -m pytest -q tests/test_uploaded_service_recovery.py tests/test_callable_host_data.py tests/test_codegen_scope_handoff.py tests/test_generated_dependency_api.py tests/test_host_scaffolded_client.py tests/test_incremental_module_gate.py tests/test_bounded_gameplay_generation.py
      - name: Compile callable host profile with real Roblox tools
        run: python tools/verify_host_profile_e2e.py
      - name: Run standalone pure Luau rules in Lune
        run: lune run tests/economy_logic
      - name: Execute genre-independent offline Luau tests in real Lune
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil, tempfile
          from roblox_mod_ai.roblox_toolchain import RobloxToolchainManager
          assert shutil.which("lune"), "Rokit must install real Lune in CI"
          with tempfile.TemporaryDirectory(prefix="rmm-any-genre-") as directory:
              root = Path(directory)
              # Rokit exposes shims; a temporary project needs its own
              # manifest or the shim refuses to resolve installed Lune.
              shutil.copyfile("rokit.toml", root / "rokit.toml")
              offline = root / "tests" / "offline"
              offline.mkdir(parents=True)
              (offline / "sample_motion.luau").write_text(
                  "--!strict\nassert(math.abs(0.4 + 0.6 - 1) < 1e-6)\n",
                  encoding="utf-8")
              (offline / "sample_rules.luau").write_text(
                  "--!strict\nassert(math.max(3, 5) == 5)\n",
                  encoding="utf-8")
              result = RobloxToolchainManager().run_lune_offline_suite(root)
              assert result["executed"] and result["success"] and result["test_count"] == 2, result
              (offline / "sample_rules.luau").write_text(
                  "--!strict\nassert(false, 'regression')\n", encoding="utf-8")
              fail = RobloxToolchainManager().run_lune_offline_suite(root)
              assert fail["executed"] and not fail["success"], fail
              assert any(x["status"] == "failed" for x in fail["tests"]), fail
          print("Generic Lune auto-discovery and real failure detection: PASS")
          PY
      - name: Generate source only (Studio gameplay must remain unverified)
        run: |
          python - <<'PY'
          from pathlib import Path
          from roblox_mod_ai.api import CompleteRobloxAISession
          root = Path(".rmm-smoke")
          session = CompleteRobloxAISession(output_root=root)
          session.plan("코인 수집, 상점 시스템, 리더보드가 포함된 검투 아레나")
          result = session.build(source_only=True)
          assert result.success and result.metadata["release_status"] == "source_only", result.metadata
          assert result.playtest_report.total_tests == 0, "No engine test was run"
          assert result.analysis_report.passed, result.analysis_report.to_dict()
          assert result.metadata["acceptance"]["passed"], result.metadata["acceptance"]
          Path(".rmm-smoke/location.txt").write_text(result.project_dir, encoding="utf-8")
          PY
      - name: Run real Wally, StyLua, Rojo
        shell: bash
        run: |
          set -euo pipefail
          project="$(cat .rmm-smoke/location.txt)"
          ( cd "$project" && wally install )
          stylua "$project/src"
          stylua --check "$project/src"
          ( cd "$project" && selene src )
          rojo build "$project/default.project.json" -o "$project/compiled.rbxlx"
          test -s "$project/compiled.rbxlx"
          python tools/audit_rojo_place.py --plan .rmm-smoke/proposal.json --place "$project/compiled.rbxlx"
          python tools/build_studio_test_place.py "$project"
          rojo build "$project/studio-tests.project.json" -o "$project/studio-e2e.rbxlx"
          test -s "$project/studio-e2e.rbxlx"
          ls -lh "$project/compiled.rbxlx"
      - name: Compile opt-in ProfileStore + Fusion project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from roblox_mod_ai.api import CompleteRobloxAISession
          session = CompleteRobloxAISession(output_root=Path(".rmm-libraries"))
          plan = session.plan("코인 수집, 상점 시스템, 리더보드가 포함된 검투 아레나 ProfileStore Fusion")
          assert plan.authored_plan.proposal.game_design["storage_backend"] == "profilestore"
          assert plan.authored_plan.proposal.game_design["ui_backend"] == "fusion"
          result = session.build(source_only=True)
          assert result.analysis_report.passed, result.analysis_report.to_dict()
          assert result.metadata["acceptance"]["passed"], result.metadata["acceptance"]
          Path(".rmm-libraries/location.txt").write_text(result.project_dir, encoding="utf-8")
          PY
          project="$(cat .rmm-libraries/location.txt)"
          ( cd "$project" && wally install )
          test -e "$project/ServerPackages/ProfileStore.lua"
          test -e "$project/Packages/Fusion.lua"
          stylua "$project/src"
          stylua --check "$project/src"
          ( cd "$project" && selene src )
          rojo build "$project/default.project.json" -o "$project/library-compiled.rbxlx"
          test -s "$project/library-compiled.rbxlx"
          python tools/audit_rojo_place.py --plan .rmm-libraries/proposal.json --place "$project/library-compiled.rbxlx"
      - name: Test non-destructive owned-Place addon installation and compile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from roblox_mod_ai.api import CompleteRobloxAISession
          from roblox_mod_ai.addon_installer import prepare_owned_addon, apply_owned_addon
          owner=Path(".rmm-owner-sample").resolve()
          owner.mkdir(parents=True, exist_ok=True)
          (owner/"src/server").mkdir(parents=True, exist_ok=True)
          (owner/"src/server/LegacyGame.server.luau").write_text('print("original untouched")', encoding="utf-8")
          tree={
              "$className":"DataModel",
              "Workspace":{"$className":"Workspace",
                           "OriginalCastle":{"$className":"Part",
                             "$properties":{"Anchored":True,"Size":[9,9,9],"Position":[100,5,0]}},
                           "SpawnLocation":{"$className":"SpawnLocation"}},
              "ReplicatedStorage":{"$className":"ReplicatedStorage",
                                   "Shared":{"$path":"src/shared"},
                                   "Remotes":{"$className":"Folder"}},
              "ServerScriptService":{"$className":"ServerScriptService","$path":"src/server"},
              "StarterPlayer":{"$className":"StarterPlayer",
                               "StarterPlayerScripts":{"$path":"src/client"}},
              "StarterGui":{"$className":"StarterGui","$path":"src/gui"},
          }
          (owner/"default.project.json").write_text(json.dumps({"name":"OwnedSample","tree":tree}),encoding="utf-8")
          session=CompleteRobloxAISession(output_root=Path(".rmm-addon-stage"))
          session.plan("코인 수집 상점 리더보드",project_mode="existing_experience_addon")
          out=session.build(source_only=True)
          assert out.metadata["addon_prepared"] and out.success, out.metadata
          assert out.metadata["release_status"] == "addon_packaged", out.metadata
          assert not out.rbxlx_path and not (Path(out.project_dir)/"default.project.json").exists()
          inspection=prepare_owned_addon(Path(out.project_dir), owner)
          assert inspection["passed"], inspection
          outcome=apply_owned_addon(Path(out.project_dir),owner,
                                    i_own_this_experience=True,reviewed_player_data=True)
          assert outcome["local_files_applied"]>0 and not outcome["published"]
          assert (owner/"src/server/LegacyGame.server.luau").read_text(encoding="utf-8")=='print("original untouched")'
          after=json.loads((owner/"default.project.json").read_text(encoding="utf-8"))["tree"]["Workspace"]
          assert "OriginalCastle" in after and "Coins" in after and "ShopStalls" in after
          assert "Baseplate" not in after
          Path(".rmm-addon-stage/location.txt").write_text(str(owner),encoding="utf-8")
          PY
          original="$(cat .rmm-addon-stage/location.txt)"
          rojo build "$original/default.project.json" -o "$original/owner-addon.rbxlx"
          test -s "$original/owner-addon.rbxlx"
          python tools/audit_rojo_place.py --plan .rmm-addon-stage/proposal.json --place "$original/owner-addon.rbxlx"
      - name: Compile novel gameplay generated through validated dynamic architect
        shell: bash
        env:
          RMM_ENABLE_MODEL_QUERY_EXPANSION: "0"
          RMM_ENABLE_DYNAMIC_DESIGN: "1"
          RMM_ENABLE_MODEL_GENERATION: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          # Mock LLM = deterministic architecture fixture. REAL Rojo compiles
          # its novel Luau code and structure; this is not a real-model test.
          import sys
          from pathlib import Path
          sys.path.insert(0,"tests")
          from test_dynamic_architecture import LocalGameModel
          from roblox_mod_ai.api import CompleteRobloxAISession
          sess=CompleteRobloxAISession(output_root=Path(".rmm-dynamic-smoke"))
          model=LocalGameModel()
          sess.planner.router=model
          sess.orchestrator.code_generator.router=model
          plan=sess.plan("펫 부화")
          assert plan.ready_to_build
          assert plan.authored_plan.proposal.game_design["dynamic_design"]
          build=sess.build(source_only=True)
          assert build.success and build.metadata["release_status"] == "source_only" and build.metadata["acceptance"]["passed"], build.metadata
          root=Path(build.project_dir)
          assert (root/"src/server/CustomPetHatching.luau").is_file()
          assert (root/"src/server/RMMServerBootstrap.server.luau").is_file()
          Path(".rmm-dynamic-smoke/location.txt").write_text(str(root),encoding="utf-8")
          PY
          project="$(cat .rmm-dynamic-smoke/location.txt)"
          stylua "$project/src"
          stylua --check "$project/src"
          ( cd "$project" && selene src )
          rojo build "$project/default.project.json" -o "$project/compiled-dynamic.rbxlx"
          test -s "$project/compiled-dynamic.rbxlx"
          python tools/audit_rojo_place.py --plan .rmm-dynamic-smoke/proposal.json --place "$project/compiled-dynamic.rbxlx"
      - name: Compile seven-space-feature cross-module fixture with real tooling
        shell: bash
        env:
          RMM_PREDESIGN_LIVE_SEARCH: "0"
          RMM_ENABLE_DYNAMIC_DESIGN: "1"
        run: |
          set -euo pipefail
          python tools/verify_space_assembly_e2e.py
          test -s .rmm-space-assembly/receipt.json
          python tools/forecast_generation.py \
            --proposal .rmm-space-assembly/proposal.json \
            --output .rmm-space-assembly/generation_forecast.json
          python tools/profile_generation_prompts.py \
            --proposal .rmm-space-assembly/proposal.json \
            --output .rmm-space-assembly/coder_prompt_profile.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path(".rmm-space-assembly/generation_forecast.json").read_text())
          counts=report["source_counts"]
          assert counts["feature_count"]==7, counts
          assert counts["generated_module_count"]==14, counts
          assert counts["remote_count"]==7, counts
          assert counts["minimum_sequential_model_completions"]==21, counts
          assert report["measured_full_game_model_runs"]["empirical_completion_rate"] is None
          profile=json.loads(Path(".rmm-space-assembly/coder_prompt_profile.json").read_text())
          assert profile["module_count"]==14, profile
          assert not profile["requirements_leak_detected"], profile
          assert all(r["has_remote_contract"] and r["has_module_file_path"]
                     and r["has_declared_own_requirement"] for r in profile["modules"])
          assert all(0 < row["single_attempt_through_static_build"] < 1 for row in report["scenarios"])
          PY
      - name: Compile diverse non-space host architectures with real Rojo
        shell: bash
        env:
          RMM_ENABLE_DYNAMIC_DESIGN: "1"
          RMM_PREDESIGN_LIVE_SEARCH: "0"
        run: |
          set -euo pipefail
          python tools/verify_diverse_host_assembly_e2e.py
          test -s .rmm-general-assembly/summary.json

      - name: Actual orchestrator E2E with real Luau and Rojo tools
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_code_e2e.py
      - name: Execute generated Luau gameplay via Lune with mocked Roblox APIs
        shell: bash
        run: |
          set -euo pipefail
          export RMM_PET_E2E_PROJECT="$(cat .rmm-code-e2e/location.txt)"
          lune run tests/pet_gameplay_e2e
      - name: Verify Luau gameplay E2E catches broken behavior
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_gameplay_mutations.py
      - name: Execute generated economy service and reject six unsafe mutations
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_economy_e2e.py
          test -s .rmm-economy-e2e/receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path(".rmm-economy-e2e/receipt.json").read_text())
          assert receipt["baseline_passed"], receipt
          assert receipt["mutations_survived"]==0, receipt
          assert receipt["mutations_killed"]==6, receipt
          PY
      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-roblox-project
          path: |
            .rmm-smoke/
            .rmm-code-e2e/
            .rmm-economy-e2e/
            .rmm-host-profile/
            .rmm-space-assembly/
            .rmm-general-assembly/
            .rmm-dynamic-smoke/
          if-no-files-found: error
          include-hidden-files: true
