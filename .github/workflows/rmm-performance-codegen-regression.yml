name: RMM weapon and crew codegen failure regressions
on:
  push:
    branches: [main]
    paths:
      - 'roblox_mod_ai/host_trade_catalog.py'
      - 'roblox_mod_ai/host_owned_weapon_performance.py'
      - 'roblox_mod_ai/code_generator.py'
      - 'roblox_mod_ai/generation_scope.py'
      - 'tests/test_plan87_real_codegen_failures.py'
      - '.github/workflows/rmm-performance-codegen-regression.yml'
  workflow_dispatch:
jobs:
  parser-and-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RMM_PREDESIGN_LIVE_SEARCH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      - name: Assert actual Luau parser installed
        run: command -v stylua
      - name: Reproduce both uploaded module failures with real Luau parser
        run: |
          RMM_REQUIRE_REAL_LUAU_PARSER=1 python -m pytest -q tests/test_plan87_real_codegen_failures.py
          RMM_REQUIRE_REAL_LUAU_PARSER=1 python -m pytest -q tests/test_host_trade_catalog.py
          RMM_REQUIRE_REAL_LUAU_PARSER=1 python -m pytest -q tests/test_plan86_market_sale_and_ship_catalog.py
