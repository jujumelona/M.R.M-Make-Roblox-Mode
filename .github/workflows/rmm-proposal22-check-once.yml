name: RMM proposal22 host contract regression (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rmm-proposal22-check-once.yml']
permissions:
  contents: write
jobs:
  full-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test requirements
        run: python -m pip install -e '.[dev]' pytest nbformat httpx pytest-cov
      - name: Python compile and entire regression suite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m compileall -q roblox_mod_ai tests > /tmp/proposal22.log 2>&1
          compile_status=$?
          if [ "$compile_status" -eq 0 ]; then
            python -m pytest -q tests >> /tmp/proposal22.log 2>&1
            rc=$?
          else
            rc=$compile_status
          fi
          {
            echo "tested_commit=$GITHUB_SHA"
            echo "exit_code=$rc"
            tail -c 25000 /tmp/proposal22.log
          } > /tmp/proposal22-result.txt
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/rmm-proposal22-result.txt" \
            -f message='test(rmm): capture proposal22 full regression output' \
            -f content="$(base64 -w0 /tmp/proposal22-result.txt)" -f branch=main
          exit "$rc"
